name: Weekly metrics refresh

# Hosting is on Cloudflare Pages, which auto-builds on every push to main.
# This workflow's only job is to refresh citation metrics on a schedule and
# commit them — that commit triggers a fresh Cloudflare build. No Netlify.

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "metrics-refresh"
  cancel-in-progress: false

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update citation metrics
        continue-on-error: true # stale metrics must never block anything
        run: |
          pip install scholarly
          python scripts/update_metrics.py

      - name: Commit refreshed metrics (triggers Cloudflare build)
        run: |
          git config user.name "metrics-bot"
          git config user.email "actions@github.com"
          git add data/scholar_metrics.json
          git diff --cached --quiet || git commit -m "chore: refresh citation metrics"
          git push
