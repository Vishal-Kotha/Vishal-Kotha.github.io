{{ define "main" }}
<div style="max-width: 1100px; margin: 0 auto; padding: 40px 20px;">

    <h1 style="color: #0a192f; margin-bottom: 10px;">{{ .Title }}</h1>
    <div style="margin-bottom: 10px; max-width: 750px;">
        {{ .Content }}
    </div>
    <p style="margin-bottom: 40px;">
        <a href="{{ "blog/index.xml" | relURL }}" style="color: #d4af37; font-weight: bold; font-size: 0.9rem; text-decoration: none;">📡 Subscribe via RSS</a>
    </p>

    <div class="project-grid">
        {{ range .Pages.ByDate.Reverse }}
        <article class="project-card">

            {{ if .Params.image }}
            <a href="{{ .Permalink }}">
                <img src="{{ .Params.image }}" alt="{{ .Title }}" style="width:100%; height:200px; object-fit:cover; border-radius:4px;">
            </a>
            {{ end }}

            <p style="font-size: 0.8rem; color: #888; margin: 15px 0 5px 0; font-family: 'Roboto', sans-serif;">
                {{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read
            </p>

            <h2 style="margin-top: 5px; font-size: 1.4rem;">
                <a href="{{ .Permalink }}" style="text-decoration: none; color: #0a192f;">
                    {{ .Title }}
                </a>
            </h2>

            <p style="font-size: 0.9rem; color: #555;">{{ .Description }}</p>

            <p>
                <a href="{{ .Permalink }}" style="color: #d4af37; font-weight: bold; font-size: 0.9rem;">
                    Read Post →
                </a>
            </p>

        </article>
        {{ end }}
    </div>

</div>
{{ end }}
